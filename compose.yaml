name: showmethepicture

# 이 파일은 Portainer 웹 에디터(Stacks → Add stack → Web editor)에 그대로 붙여넣는 용도다.
# 이미지는 GitHub Actions 가 ghcr.io/nr2bj/showmethepicture 로 올린 것을 받으므로 레포 클론이 필요 없다.
# ${...} 자리는 Portainer 의 Environment variables 로 채워도 되고, 그냥 값으로 바꿔 써도 된다.
#
# 설정의 경계 (docs/DESIGN.md §8.1)
#  - 여기에는 "인프라"만: 마운트 경로, DB 비밀번호, 도메인/ORIGIN, 이미지 태그.
#  - 사진 폴더(Source) 등록, 사이트 제목, 공개 정책, 검색 모델 같은 "앱 설정"은 관리자 페이지에서 바꾸고
#    DB(db-data 볼륨)에 저장된다. 재배포해도 유지된다.
#  - PHOTOS_HOST_PATH 는 넓게(풀 전체 또는 photo123 의 부모) 잡고, 실제 폴더는 앱 안 폴더 선택기로 고른다.
#
# 새 이미지가 올라오면 Portainer 에서 스택의 "Pull and redeploy" 한 번이면 된다.
# TLS·도메인은 이 스택 밖의 reverse proxy(예: Proxmox LXC 의 Caddy)가 맡고, app 의 3000 포트로 프록시한다.
# 외부 프록시가 없으면 compose.caddy.yaml 을 겹쳐 쓴다.
# 소스에서 직접 빌드하려면: docker compose -f compose.yaml -f compose.build.yaml up -d --build

x-app: &app
  image: ghcr.io/nr2bj/showmethepicture:${APP_TAG:-latest}
  environment:
    NODE_ENV: production
    PORT: '3000'
    ORIGIN: ${ORIGIN:-http://localhost}
    DATABASE_URL: postgres://${POSTGRES_USER:-smtp}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smtp}
    PHOTOS_ROOT: /photos
    CACHE_DIR: /cache
    ML_URL: http://ml:3003
    # ml-cache 볼륨을 app 에도 붙여 설정 화면에서 받아 둔 모델을 보고 지울 수 있게 (선택)
    ML_CACHE_DIR: /mlcache
    # 컨테이너가 이 uid/gid 로 돈다. 사진 파일을 읽을 수 있고 캐시에 쓸 수 있어야 한다.
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    # 프록시 뒤에서 클라이언트 IP 를 보기 위해 (로그인 시도 제한). caddy 는 X-Forwarded-For 를 붙인다.
    ADDRESS_HEADER: X-Forwarded-For
    XFF_DEPTH: '1'
  volumes:
    - ${PHOTOS_HOST_PATH:?set PHOTOS_HOST_PATH}:/photos:ro
    - ${CACHE_HOST_PATH:?set CACHE_HOST_PATH}:/cache
    - ml-cache:/mlcache
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-smtp}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smtp} -d ${POSTGRES_DB:-smtp}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    <<: *app
    # 기동 시 마이그레이션 적용 후 SvelteKit 서버 시작
    command: ['sh', '-c', 'node --import tsx src/lib/server/db/migrate.ts && node build']
    ports:
      - '${APP_PORT:-3000}:3000' # 외부 reverse proxy 가 여기로 프록시
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *app
    command: ['node', '--import', 'tsx', 'src/worker/index.ts']
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started

  ml:
    # Immich 의 ML 서비스를 임베딩 엔진으로 재사용. OpenVINO 빌드가 /dev/dri 로 Intel Arc A380 을 쓴다.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_ML_VERSION:-release}-openvino
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ml-cache:/cache
    restart: unless-stopped

volumes:
  db-data:
  ml-cache:
