# main 에 push 하거나 v* 태그를 달면 app/worker 공용 이미지를 GHCR 에 올린다.
#   ghcr.io/nr2bj/showmethepicture:latest        (main)
#   ghcr.io/nr2bj/showmethepicture:sha-xxxxxxx   (커밋)
#   ghcr.io/nr2bj/showmethepicture:0.1.0         (v0.1.0 태그)
# 레포가 private 이면 Portainer 에 ghcr.io 레지스트리(PAT, read:packages)를 등록해야 pull 된다.
name: docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    # 이미지에 영향 없는 파일만 바뀌면 빌드를 건너뛴다
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'compose*.yaml'
      - '.env.example'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nr2bj/showmethepicture
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      # 1) 빌드해서 러너의 docker 에 올린다 (push 전 스모크 테스트용)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          load: true
          tags: smtp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 2) 컨테이너 스모크: PUID 로 권한이 내려가는지, sharp/exiftool 이 리눅스에서 도는지
      - name: Smoke test image
        run: |
          set -eux
          docker run --rm -e PUID=1000 -e PGID=1000 smtp:smoke id -u | grep -x 1000
          docker run --rm -e PUID=0 smtp:smoke id -u | grep -x 0
          mkdir -p /tmp/smoke-cache && sudo chown root:root /tmp/smoke-cache
          docker run --rm -e PUID=1000 -e PGID=1000 -v /tmp/smoke-cache:/cache smtp:smoke sh -c 'touch /cache/ok && stat -c %u /cache/ok' | grep -x 1000
          docker run --rm -e PUID=1000 smtp:smoke node -e "const s=require('sharp'); s({create:{width:8,height:8,channels:3,background:'#123'}}).webp().toBuffer().then(b=>{if(b.length<10)throw 1;console.log('sharp ok',b.length)})"
          docker run --rm -e PUID=1000 smtp:smoke node -e "const {exiftool}=require('exiftool-vendored'); exiftool.version().then(v=>{console.log('exiftool',v); return exiftool.end()})"
          docker run --rm -e PUID=1000 smtp:smoke node -e "require('pg-boss'); require('postgres'); console.log('deps ok')"
      # 3) 같은 캐시로 다시 빌드해 GHCR 로 푸시 (레이어가 전부 캐시라 빠르다)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      # 선택: 레포 Secrets 에 PORTAINER_WEBHOOK(스택 webhook URL)을 넣으면 빌드 후 자동 재배포
      - name: Trigger Portainer redeploy (optional)
        env:
          HOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        if: ${{ env.HOOK != '' }}
        run: curl -fsS -X POST "$HOOK"
