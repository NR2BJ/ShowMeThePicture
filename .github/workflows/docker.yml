# main 에 push 하거나 v* 태그를 달면 app/worker 공용 이미지를 GHCR 에 올린다.
#   ghcr.io/nr2bj/showmethepicture:latest        (main)
#   ghcr.io/nr2bj/showmethepicture:sha-xxxxxxx   (커밋)
#   ghcr.io/nr2bj/showmethepicture:0.1.0         (v0.1.0 태그)
# 레포가 private 이면 Portainer 에 ghcr.io 레지스트리(PAT, read:packages)를 등록해야 pull 된다.
name: docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nr2bj/showmethepicture
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 선택: 레포 Secrets 에 PORTAINER_WEBHOOK(스택 webhook URL)을 넣으면 빌드 후 자동 재배포
      - name: Trigger Portainer redeploy (optional)
        env:
          HOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        if: ${{ env.HOOK != '' }}
        run: curl -fsS -X POST "$HOOK"
